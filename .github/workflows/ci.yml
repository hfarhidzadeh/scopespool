name: Core tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The Actions Python 3.9 build is available on this runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ScopeSpool
        run: python -m pip install .
      - name: Run core tests
        run: python -m unittest discover -s tests
      - name: Check the installed CLI
        run: |
          db="$RUNNER_TEMP/scopespool-smoke.sqlite3"
          scopespool --db "$db" init
          scopespool --db "$db" add "SQLite package smoke check" --type fact
          scopespool --db "$db" search SQLite | grep -F "SQLite package smoke check"
