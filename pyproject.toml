[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scopespool"
version = "0.2.0"
description = "A local-first prototype for typed, self-curating agent memory."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "hfarhidzadeh" }]
keywords = ["agent memory", "sqlite", "retrieval", "access control", "multi-user"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/hfarhidzadeh/scopespool"
Source = "https://github.com/hfarhidzadeh/scopespool"
Issues = "https://github.com/hfarhidzadeh/scopespool/issues"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]

[project.scripts]
scopespool = "dynmemory.cli:main"
memvane = "dynmemory.cli:main"  # earlier name, kept as an alias

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
